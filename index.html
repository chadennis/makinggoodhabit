<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Serif+KR:wght@600&display=swap" rel="stylesheet">
<title>수인이의 도전! 한자 · 세계사 퀴즈</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff6e0;--card:#fffdf6;--ink:#2a2118;--sub:#6b5b48;--line:#2a2118;--hanja:#c8321e;--hist:#1f5fa8;--ok:#2e8b4f;--no:#c8321e;--gold:#f2b100}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1a14;--card:#2b241b;--ink:#f6ead2;--sub:#c4b494;--line:#f6ead2;--hanja:#ff7a63;--hist:#6fb0ff;--ok:#5fd08a;--no:#ff7a63;--gold:#f2b100}}
:root[data-theme="dark"]{--bg:#1f1a14;--card:#2b241b;--ink:#f6ead2;--sub:#c4b494;--line:#f6ead2;--hanja:#ff7a63;--hist:#6fb0ff;--ok:#5fd08a;--no:#ff7a63;--gold:#f2b100}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Jua","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:18px;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
.user-bar{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 14px;margin-bottom:14px}
.user-tag{display:flex;align-items:center;gap:6px;font-size:1.05rem;font-weight:bold}
.user-btn{font:inherit;font-size:.9rem;background:none;border:1.5px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}
h1{font-size:2rem;margin:8px 0 4px;line-height:1.2}
p.sub{color:var(--sub);margin:0 0 16px}
.menu{display:grid;gap:14px}
.big{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:18px;padding:16px 18px;cursor:pointer;box-shadow:4px 4px 0 var(--line)}
.big:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.big b{display:block;font-size:1.35rem}
.big span{color:var(--sub);font-size:.95rem}
.big .k{font-size:2.4rem;float:right;line-height:1;margin-left:10px}
.hanja .k{color:var(--hanja)}.hist .k{color:var(--hist)}
button:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.pill{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:2px 12px;font-size:.95rem}
.bar{height:12px;border:2px solid var(--line);border-radius:99px;background:var(--card);overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.q{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:18px;text-align:center;margin-bottom:14px}
.q .glyph{font-size:min(5.5rem,13vw);line-height:1.1;font-family:"Noto Serif KR","Batang",serif}
.q .txt{font-size:1.25rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{font:inherit;font-size:1.15rem;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:14px;padding:12px 8px;cursor:pointer;min-height:56px}
.opt.glyph{font-size:2.4rem;font-family:"Noto Serif KR","Batang",serif}
.opt.ok{background:var(--ok);color:#fff}.opt.no{background:var(--no);color:#fff}
.opt:disabled{cursor:default}
.hist-opts{grid-template-columns:1fr}
.fb{margin-top:14px;padding:12px 14px;border-radius:14px;border:3px solid var(--line);background:var(--card);display:none}
.fb.show{display:block}
.next{margin-top:12px;font:inherit;font-size:1.2rem;background:var(--gold);color:#2a2118;border:3px solid var(--line);border-radius:14px;padding:10px 22px;cursor:pointer;box-shadow:3px 3px 0 var(--line)}
.result{text-align:center}
.stars{font-size:3rem;letter-spacing:4px}
.back{font:inherit;background:none;border:none;color:var(--sub);cursor:pointer;text-decoration:underline;padding:4px}
.hide{display:none}
/* 모달 창 */
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99}
.modal-box{background:var(--bg);border:3px solid var(--line);border-radius:20px;padding:22px;width:100%;max-width:440px;box-shadow:6px 6px 0 var(--line);max-height:85vh;overflow-y:auto}
.modal-box h2{margin:0 0 12px;font-size:1.5rem}
.modal-input{width:100%;padding:10px 14px;font:inherit;border:2px solid var(--line);border-radius:12px;margin:8px 0 16px;background:var(--card);color:var(--ink)}
.stat-item{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;font-size:.95rem}
</style>
</head>
<body>
<main>

<div class="user-bar">
  <div class="user-tag" id="userDisplay">👤 게스트</div>
  <div style="display:flex;gap:6px">
    <button class="user-btn" id="openNoteBtn" style="display:none">📖 오답노트</button>
    <button class="user-btn" id="loginBtn">로그인</button>
  </div>
</div>

<section id="home">
  <h1>도전! 퀴즈 왕 🏆</h1>
  <p class="sub">10문제씩 풀고 별을 모아 봐요.</p>
  <div class="menu">
    <button class="big hanja" data-mode="hanja1"><span class="k">字</span><b>구몬 B단계 복습</b><span>배운 한자 90자의 훈과 음 맞히기</span></button>
    <button class="big hanja" data-mode="hanja2"><span class="k">漢</span><b>한자 모양 도전</b><span>비슷한 글자 구별하기, 글자 합쳐 만들기</span></button>
    <button class="big hanja" data-mode="hanja3"><span class="k">級</span><b>한자 5급 도전 (150자)</b><span>대한검정회 5급 한자의 훈과 음 맞히기</span></button>
    <button class="big hist" data-mode="hist"><span class="k">🌍</span><b>세계사 퀴즈</b><span>굵직한 사건과 인물을 맞혀 봐요</span></button>
  </div>
  <p class="sub" id="best" style="margin-top:20px"></p>
</section>

<section id="game" class="hide">
  <div class="top">
    <button class="back" id="quit">← 처음으로</button>
    <span class="pill" id="score">0점</span>
    <span class="pill" id="combo"></span>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <div class="q" id="qbox"></div>
  <div class="opts" id="opts"></div>
  <div class="fb" id="fb"></div>
  <div style="text-align:center"><button class="next hide" id="next">다음 문제</button></div>
</section>

<section id="end" class="hide result">
  <div class="stars" id="stars"></div>
  <h1 id="endt"></h1>
  <p class="sub" id="endp"></p>
  <button class="next" id="again">다시 도전</button>
  <button class="next" id="home2" style="background:var(--card);color:var(--ink)">처음으로</button>
</section>

</main>

<!-- 로그인 모달 -->
<div id="loginModal" class="modal hide">
  <div class="modal-box">
    <h2>프로필 선택 🦁</h2>
    <p class="sub" style="margin-bottom:8px">수인이면 비밀번호를, 손님이면 이름을 적어주세요.</p>
    <label style="font-size:.95rem"><b>역할 선택:</b></label>
    <select id="roleSelect" class="modal-input" onchange="togglePinInput()">
      <option value="guest">체험 손님 (게스트)</option>
      <option value="suin">🦁 수인 (비밀번호 필요)</option>
    </select>
    
    <div id="guestField">
      <label style="font-size:.95rem"><b>손님 닉네임:</b></label>
      <input type="text" id="guestNameInput" class="modal-input" placeholder="이름을 입력해 주세요" maxlength="10">
    </div>

    <div id="pinField" class="hide">
      <label style="font-size:.95rem"><b>수인이 4자리 비밀번호:</b></label>
      <input type="password" id="pinInput" class="modal-input" placeholder="4자리 숫자" maxlength="4" inputmode="numeric">
    </div>

    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="next" style="flex:1;margin-top:0" onclick="applyLogin()">확인</button>
      <button class="next" style="background:var(--card);color:var(--ink);margin-top:0" onclick="closeModal('loginModal')">취소</button>
    </div>
  </div>
</div>

<!-- 오답 노트 모달 -->
<div id="noteModal" class="modal hide">
  <div class="modal-box">
    <h2>🦁 수인이의 오답 노트</h2>
    <div id="noteContent" style="min-height:120px;font-size:.95rem;">불러오는 중...</div>
    <button class="next" style="width:100%;margin-top:16px" onclick="closeModal('noteModal')">닫기</button>
  </div>
</div>

<script>
// ===== 사용자 인증 관리 (수인이 비밀번호 기본값: 2017) =====
const SUIN_PIN = "2017"; // 필요에 따라 변경하실 수 있습니다.
let currentUser = store("activeUser") || { role: "guest", name: "게스트" };

function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}

function updateUserBar() {
  const isSuin = currentUser.role === "suin";
  $("userDisplay").textContent = isSuin ? "🦁 수인" : `👤 ${currentUser.name}`;
  $("openNoteBtn").style.display = isSuin ? "inline-block" : "none";
  $("loginBtn").textContent = isSuin ? "로그아웃" : "사용자 변경";
}

$("loginBtn").onclick = () => {
  if (currentUser.role === "suin") {
    currentUser = { role: "guest", name: "게스트" };
    store("activeUser", currentUser);
    updateUserBar();
    showBest();
  } else {
    $("loginModal").classList.remove("hide");
    togglePinInput();
  }
};

function togglePinInput() {
  const role = $("roleSelect").value;
  if (role === "suin") {
    $("guestField").classList.add("hide");
    $("pinField").classList.remove("hide");
    $("pinInput").focus();
  } else {
    $("guestField").classList.remove("hide");
    $("pinField").classList.add("hide");
    $("guestNameInput").focus();
  }
}

function applyLogin() {
  const role = $("roleSelect").value;
  if (role === "suin") {
    const pin = $("pinInput").value;
    if (pin === SUIN_PIN) {
      currentUser = { role: "suin", name: "수인" };
      store("activeUser", currentUser);
      closeModal('loginModal');
      $("pinInput").value = "";
      updateUserBar();
      showBest();
    } else {
      alert("비밀번호가 일치하지 않아요!");
      $("pinInput").value = "";
      $("pinInput").focus();
    }
  } else {
    const gName = $("guestNameInput").value.trim() || "게스트";
    currentUser = { role: "guest", name: gName };
    store("activeUser", currentUser);
    closeModal('loginModal');
    updateUserBar();
    showBest();
  }
}

function closeModal(id) { $(id).classList.add("hide"); }

// 오답 노트 불러오기
$("openNoteBtn").onclick = async () => {
  $("noteModal").classList.remove("hide");
  $("noteContent").innerHTML = "기록을 불러오는 중...";
  try {
    const res = await fetch(`/api/attempts?player=${encodeURIComponent(currentUser.name)}`);
    const data = await res.json();
    if (!data.wrong || data.wrong.length === 0) {
      $("noteContent").innerHTML = "<p style='color:var(--ok);'>🎉 틀린 문제가 없어요! 완벽합니다.</p>";
      return;
    }
    let html = "<p class='sub' style='margin-bottom:8px'>자주 헷갈렸던 문제들이에요:</p>";
    data.wrong.forEach(w => {
      html += `<div class="stat-item"><b>문제:</b> ${w.question}<br><span style="color:var(--ok);">정답: ${w.answer}</span> (오답 ${w.misses}회)</div>`;
    });
    $("noteContent").innerHTML = html;
  } catch (err) {
    $("noteContent").innerHTML = "<p style='color:var(--no);'>기록을 불러오지 못했습니다.</p>";
  }
};

/* ===== 문제 데이터: 구몬 B단계 & 5급 & 세계사 ===== */
const H1=[["一","한 일"],["二","두 이"],["三","석 삼"],["四","넉 사"],["五","다섯 오"],["六","여섯 륙"],["七","일곱 칠"],["八","여덟 팔"],["九","아홉 구"],["十","열 십"],["日","날 일"],["月","달 월"],["火","불 화"],["水","물 수"],["木","나무 목"],["金","쇠 금"],["土","흙 토"],["山","메 산"],["川","내 천"],["人","사람 인"],["口","입 구"],["目","눈 목"],["手","손 수"],["足","발 족"],["大","큰 대"],["小","작을 소"],["中","가운데 중"],["上","윗 상"],["下","아래 하"],["父","아비 부"],["母","어미 모"],["女","계집 녀"],["男","사내 남"],["子","아들 자"],["門","문 문"],["王","임금 왕"],["白","흰 백"],["東","동녘 동"],["西","서녘 서"],["南","남녘 남"],["北","북녘 북"],["外","바깥 외"],["力","힘 력"]];
const B=[["目","눈 목"],["耳","귀 이"],["心","마음 심"],["口","입 구"],["足","발 족"],["立","설 립"],["犬","개 견"],["牛","소 우"],["羊","양 양"],["馬","말 마"],["鳥","새 조"],["魚","물고기 어"],["父","아버지 부"],["母","어머니 모"],["兒","아이 아"],["衣","옷 의"],["子","아들 자"],["王","임금 왕"],["力","힘 력"],["雨","비 우"],["夕","저녁 석"],["光","빛 광"],["果","과실 과"],["金","쇠 금"],["石","돌 석"],["男","남자 남"],["女","여자 녀"],["刀","칼 도"],["兄","형 형"],["弟","아우 제"],["左","왼 좌"],["右","오른 우"],["門","문 문"],["車","수레 차"],["品","물건 품"],["米","쌀 미"],["天","하늘 천"],["東","동녘 동"],["西","서녘 서"],["太","클 태"],["主","주인 주"],["北","북녘 북"],["南","남녘 남"],["方","모 방"],["己","몸 기"],["風","바람 풍"],["白","흰 백"],["自","스스로 자"],["弓","활 궁"],["先","먼저 선"],["本","근본 본"],["末","끝 말"],["多","많을 다"],["少","적을 소"],["身","몸 신"],["半","반 반"],["兩","둘 량"],["明","밝을 명"],["村","마을 촌"],["地","땅 지"],["時","때 시"],["姓","성씨 성"],["料","헤아릴 료"],["星","별 성"],["名","이름 명"],["安","편안할 안"],["字","글자 자"],["家","집 가"],["習","익힐 습"],["理","다스릴 리"],["期","기약할 기"],["注","물댈 주"],["等","등급 등"],["話","이야기 화"],["親","친할 친"],["校","학교 교"],["記","기록할 기"],["間","사이 간"],["聞","들을 문"],["童","아이 동"],["新","새로울 신"],["雪","눈 설"],["江","강 강"],["初","처음 초"],["孝","효도 효"],["問","물을 문"],["活","살 활"],["室","방 실"],["科","과목 과"],["敎","가르칠 교"]];

/* ===== 게임 엔진 ===== */
const $=id=>document.getElementById(id);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let mode,qs,idx,score,combo,best=0,locked,log=[];
const NAMES={hanja1:"B단계 복습",hanja2:"모양 도전",hanja3:"5급 도전",hist:"세계사"};

function showBest(){
  const userKey = `quizBest_${currentUser.name}`;
  const b = store(userKey) || {};
  const t = Object.keys(b).map(k=>NAMES[k]+" "+b[k]+"점").join(" / ");
  $("best").textContent = t ? `[${currentUser.name}] 최고 기록: ` + t : "";
}

function makeHanja(pool,all){
  return shuffle(pool).slice(0,10).map(([g,m])=>{
    const forward=Math.random()<0.6;
    const others=shuffle(all.filter(x=>x[0]!==g)).slice(0,3);
    if(forward) return{type:"g",glyph:g,text:"이 한자의 훈과 음은?",ans:m,opts:shuffle([m,...others.map(o=>o[1])]),exp:g+" = "+m};
    return{type:"c",text:"“"+m+"” 에 알맞은 한자는?",ans:g,opts:shuffle([g,...others.map(o=>o[0])]),glyphOpts:true,exp:g+" = "+m};
  });
}
function makeShape(){
  const sim=shuffle(SIM).slice(0,5).map(s=>{
    const g=shuffle([...s])[0];
    let pool=[...s];
    shuffle(B.map(x=>x[0])).forEach(c=>{if(pool.length<4&&!pool.includes(c))pool.push(c)});
    return{type:"g",glyph:g,text:"비슷한 글자와 헷갈리지 마세요! 훈과 음은?",ans:BM[g],opts:shuffle(pool.map(c=>BM[c])),exp:[...s].map(c=>c+" "+BM[c]).join(" / ")};
  });
  const mk=shuffle(COMBO).slice(0,5).map(([p,a,d])=>({type:"c",glyph:p,text:"합치면 어떤 한자가 될까요?",ans:a,opts:shuffle([a,...d]),glyphOpts:true,exp:p+" = "+a+" ("+BM[a]+")"}));
  return shuffle([...sim,...mk]);
}
function makeHist(){
  return shuffle(W).slice(0,10).map(([q,a,w,e])=>({type:"h",text:q,ans:a,opts:shuffle([a,...w]),exp:e}));
}
function start(m){
  mode=m;
  qs=m==="hist"?makeHist():m==="hanja1"?makeHanja(B,B):m==="hanja3"?makeHanja(G5,G5):makeShape();
  idx=0;score=0;combo=0;log=[];
  $("home").classList.add("hide");$("end").classList.add("hide");$("game").classList.remove("hide");
  render();
}
function render(){
  const q=qs[idx];locked=false;
  $("prog").style.width=(idx/qs.length*100)+"%";
  $("score").textContent=score+"점";
  $("combo").textContent=combo>=2?"🔥 "+combo+"연속":"";
  $("qbox").innerHTML=(q.glyph?'<div class="glyph">'+q.glyph+'</div>':"")+'<div class="txt">'+(idx+1)+"/"+qs.length+" · "+q.text+"</div>";
  const o=$("opts");o.className="opts"+(q.type==="h"?" hist-opts":"");o.innerHTML="";
  q.opts.forEach(t=>{const b=document.createElement("button");b.className="opt"+(q.glyphOpts?" glyph":"");b.textContent=t;b.onclick=()=>pick(b,t);o.appendChild(b)});
  $("fb").className="fb";$("next").classList.add("hide");
}
function pick(btn,t){
  if(locked)return;locked=true;
  const q=qs[idx],right=t===q.ans;
  log.push({q:(q.glyph?q.glyph+" ":"")+q.text,chosen:t,answer:q.ans,correct:right});
  [...$("opts").children].forEach(b=>{b.disabled=true;if(b.textContent===q.ans)b.classList.add("ok")});
  if(right){combo++;score+=10+(combo>=3?5:0)}else{combo=0;btn.classList.add("no")}
  $("score").textContent=score+"점";
  $("combo").textContent=combo>=2?"🔥 "+combo+"연속":"";
  $("fb").innerHTML=(right?"🎉 정답!":"😮 아쉬워요!")+" "+q.exp;
  $("fb").className="fb show";
  $("next").textContent=idx===qs.length-1?"결과 보기":"다음 문제";
  $("next").classList.remove("hide");$("next").focus();
}
function finish(){
  $("game").classList.add("hide");$("end").classList.remove("hide");
  const max=qs.length*10;const r=score/max;
  const n=r>=.9?3:r>=.6?2:r>=.3?1:0;
  $("stars").textContent="⭐".repeat(n)+"☆".repeat(3-n);
  $("endt").textContent=score+"점!";
  $("endp").textContent=n===3?"대단해요! 완벽에 가까워요.":n===2?"잘했어요! 한 번 더 하면 별 3개!":"좋은 시작이에요. 다시 도전해 볼까요?";
  
  const userKey = `quizBest_${currentUser.name}`;
  const b=store(userKey)||{};
  if(!b[mode]||score>b[mode]){b[mode]=score;store(userKey,b)}

  // 현재 사용자 이름으로 저장
  fetch("/api/attempts",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({player:currentUser.name,mode,score,total:qs.length,answers:log})
  }).catch(()=>{});
}
$("next").onclick=()=>{idx++;idx>=qs.length?finish():render()};
$("again").onclick=()=>start(mode);
const home=()=>{$("game").classList.add("hide");$("end").classList.add("hide");$("home").classList.remove("hide");showBest()};
$("home2").onclick=home;$("quit").onclick=home;
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>start(b.dataset.mode));

updateUserBar();
showBest();
</script>
