<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Serif+KR:wght@600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<title>수인이의 좋은 습관 만들기 & 도전 퀴즈 🏆</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff6e0;--card:#fffdf6;--ink:#2a2118;--sub:#6b5b48;--line:#2a2118;--hanja:#c8321e;--hist:#1f5fa8;--ok:#2e8b4f;--no:#c8321e;--gold:#f2b100;--key:#ff9f43}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1a14;--card:#2b241b;--ink:#f6ead2;--sub:#c4b494;--line:#f6ead2;--hanja:#ff7a63;--hist:#6fb0ff;--ok:#5fd08a;--no:#ff7a63;--gold:#f2b100;--key:#ffa834}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Jua","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:18px;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:16px 16px 40px}

/* 상단 유저바 */
.user-bar{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 14px;margin-bottom:12px}
.user-tag{display:flex;align-items:center;gap:6px;font-size:1.05rem;font-weight:bold}
.user-btn{font:inherit;font-size:.9rem;background:none;border:1.5px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}

/* 상태 대시보드 카드 */
.dash-card{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:18px;box-shadow:4px 4px 0 var(--line)}
.dash-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dash-date{font-size:1.05rem;color:var(--sub)}
.dash-stats{display:flex;gap:10px}
.stat-pill{display:flex;align-items:center;gap:5px;background:var(--bg);border:2px solid var(--line);border-radius:99px;padding:4px 12px;font-size:1rem;font-weight:bold}

/* 섹션 타이틀 */
.sec-title{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}
.sec-title h2{font-size:1.45rem;margin:0}
.sec-sub{font-size:.9rem;color:var(--sub)}

/* 퀘스트 목록 */
.quest-list{display:grid;gap:10px;margin-bottom:14px}
.quest-item{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:2.5px solid var(--line);border-radius:14px;padding:12px 14px;transition:all .2s;box-shadow:2px 2px 0 var(--line)}
.quest-item.done{background:#e8f8f0;border-color:var(--ok);opacity:0.85}
.quest-left{display:flex;align-items:center;gap:12px;cursor:pointer;flex:1}
.quest-check{width:26px;height:26px;border:2px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;background:white}
.quest-item.done .quest-check{background:var(--ok);color:white;border-color:var(--ok)}
.quest-text{font-size:1.15rem}
.quest-item.done .quest-text{text-decoration:line-through;color:var(--sub)}
.quest-reward{font-size:.9rem;color:var(--key);font-weight:bold;margin-left:auto;padding-right:10px}
.del-btn{background:none;border:none;color:#a4b0be;cursor:pointer;font-size:1.1rem;padding:4px}
.del-btn:hover{color:var(--no)}

/* 퀘스트 직접 등록 폼 */
.add-quest-box{display:flex;gap:8px;margin-bottom:20px}
.quest-input{flex:1;padding:10px 14px;font:inherit;font-size:1.05rem;border:2.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);outline:none}
.quest-input:focus{border-color:var(--gold)}
.add-btn{background:var(--gold);color:var(--ink);border:2.5px solid var(--line);border-radius:12px;padding:0 18px;font:inherit;font-size:1.05rem;cursor:pointer;box-shadow:2px 2px 0 var(--line);white-space:nowrap}
.add-btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--line)}

/* 퀴즈 메뉴 */
.menu{display:grid;gap:12px}
.big{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;box-shadow:4px 4px 0 var(--line);position:relative}
.big:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--line)}
.big b{display:block;font-size:1.3rem}
.big span{color:var(--sub);font-size:.95rem}
.big .k{font-size:2.2rem;float:right;line-height:1;margin-left:8px}
.big .cost-tag{display:inline-block;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:2px 8px;font-size:.85rem;color:var(--key);margin-top:6px;font-weight:bold}
.hanja .k{color:var(--hanja)}.hist .k{color:var(--hist)}

/* 퀴즈 진행 게임 화면 */
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.pill{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:2px 12px;font-size:.95rem}
.bar{height:12px;border:2px solid var(--line);border-radius:99px;background:var(--card);overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.q{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:18px;text-align:center;margin-bottom:14px}
.q .glyph{font-size:min(5.5rem,13vw);line-height:1.1;font-family:"Noto Serif KR","Batang",serif}
.q .txt{font-size:1.25rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{font:inherit;font-size:1.15rem;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:14px;padding:12px 8px;cursor:pointer;min-height:56px}
.opt.ok{background:var(--ok);color:#fff}.opt.no{background:var(--no);color:#fff}
.opt:disabled{cursor:default}
.hist-opts{grid-template-columns:1fr}
.fb{margin-top:14px;padding:12px 14px;border-radius:14px;border:3px solid var(--line);background:var(--card);display:none}
.fb.show{display:block}
.next{margin-top:12px;font:inherit;font-size:1.2rem;background:var(--gold);color:#2a2118;border:3px solid var(--line);border-radius:14px;padding:10px 22px;cursor:pointer;box-shadow:3px 3px 0 var(--line)}
.result{text-align:center}
.stars{font-size:3rem;letter-spacing:4px}
.back{font:inherit;background:none;border:none;color:var(--sub);cursor:pointer;text-decoration:underline;padding:4px}

/* 모달 */
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99}
.modal-box{background:var(--bg);border:3px solid var(--line);border-radius:20px;padding:22px;width:100%;max-width:440px;box-shadow:6px 6px 0 var(--line);max-height:85vh;overflow-y:auto}
.modal-box h2{margin:0 0 12px;font-size:1.5rem}
.modal-input{width:100%;padding:10px 14px;font:inherit;border:2px solid var(--line);border-radius:12px;margin:8px 0 16px;background:var(--card);color:var(--ink)}
.stat-item{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;font-size:.95rem}
.hide{display:none !important}
</style>
</head>
<body>
<main>

<div class="user-bar">
  <div class="user-tag" id="userDisplay">👤 게스트</div>
  <div style="display:flex;gap:6px">
    <button class="user-btn" id="openNoteBtn" style="display:none">📖 오답노트</button>
    <button class="user-btn" id="loginBtn">로그인</button>
  </div>
</div>

<section id="home">
  <div class="dash-card">
    <div class="dash-header">
      <div class="dash-date" id="currentDateStr">오늘의 도전</div>
      <div class="dash-stats">
        <div class="stat-pill" title="보유 열쇠">🔑 <span id="keyCount">0</span>개</div>
        <div class="stat-pill" title="연속 달성">🔥 <span id="streakCount">0</span>일</div>
      </div>
    </div>
    <div style="font-size:.95rem;color:var(--sub)">
      💡 <b>오늘 내가 정한 퀘스트</b>를 완료하고 <b>열쇠(🔑)</b>를 모아 퀴즈에 도전하세요!
    </div>
  </div>

  <div class="sec-title">
    <h2>🎯 오늘 내가 정한 퀘스트</h2>
    <span class="sec-sub" id="questProgress">0개 완료</span>
  </div>

  <div class="quest-list" id="questList">
    <div style="text-align:center;padding:16px;color:var(--sub)">퀘스트를 불러오는 중...</div>
  </div>

  <form class="add-quest-box" id="addQuestForm" onsubmit="handleCreateQuest(event)">
    <input type="text" id="newQuestTitle" class="quest-input" placeholder="오늘 해낼 일을 적어보세요 (예: 구몬 한자 5장, 책 30분)" maxlength="40" required>
    <button type="submit" class="add-btn">+ 퀘스트 추가</button>
  </form>

  <div class="sec-title" style="margin-top:28px">
    <h2>⚔️ 도전 퀴즈 아레나</h2>
    <span class="sec-sub">1판당 🔑 1개 소모</span>
  </div>

  <div class="menu">
    <button class="big hanja" onclick="handleStartQuiz('hanja1')">
      <span class="k">字</span>
      <b>구몬 B단계 복습</b>
      <span>배운 한자 90자의 훈과 음 맞히기</span>
      <div class="cost-tag">🔑 열쇠 1개</div>
    </button>
    <button class="big hanja" onclick="handleStartQuiz('hanja2')">
      <span class="k">漢</span>
      <b>한자 모양 도전</b>
      <span>비슷한 글자 구별하기, 글자 합쳐 만들기</span>
      <div class="cost-tag">🔑 열쇠 1개</div>
    </button>
    <button class="big hanja" onclick="handleStartQuiz('hanja3')">
      <span class="k">級</span>
      <b>한자 5급 도전 (150자)</b>
      <span>대한검정회 5급 한자의 훈과 음 맞히기</span>
      <div class="cost-tag">🔑 열쇠 1개</div>
    </button>
    <button class="big hist" onclick="handleStartQuiz('hist')">
      <span class="k">🌍</span>
      <b>세계사 퀴즈</b>
      <span>고대 문명부터 현대까지 사건과 인물 맞히기</span>
      <div class="cost-tag">🔑 열쇠 1개</div>
    </button>
  </div>
  <p class="sub" id="best" style="margin-top:20px;text-align:center"></p>
</section>

<section id="game" class="hide">
  <div class="top">
    <button class="back" id="quit">← 나가기</button>
    <span class="pill" id="score">0점</span>
    <span class="pill" id="combo"></span>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <div class="q" id="qbox"></div>
  <div class="opts" id="opts"></div>
  <div class="fb" id="fb"></div>
  <div style="text-align:center"><button class="next hide" id="next">다음 문제</button></div>
</section>

<section id="end" class="hide result">
  <div class="stars" id="stars"></div>
  <h1 id="endt"></h1>
  <p class="sub" id="endp"></p>
  <button class="next" id="again">다시 도전</button>
  <button class="next" id="home2" style="background:var(--card);color:var(--ink)">처음으로</button>
</section>

</main>

<div id="loginModal" class="modal hide">
  <div class="modal-box">
    <h2>프로필 선택 🦁</h2>
    <p class="sub" style="margin-bottom:8px">수인이면 비밀번호를, 손님이면 이름을 적어주세요.</p>
    <label style="font-size:.95rem"><b>역할 선택:</b></label>
    <select id="roleSelect" class="modal-input" onchange="togglePinInput()">
      <option value="guest">체험 손님 (게스트)</option>
      <option value="suin">🦁 수인 (비밀번호 필요)</option>
    </select>
    
    <div id="guestField">
      <label style="font-size:.95rem"><b>손님 닉네임:</b></label>
      <input type="text" id="guestNameInput" class="modal-input" placeholder="이름을 입력해 주세요" maxlength="10">
    </div>

    <div id="pinField" class="hide">
      <label style="font-size:.95rem"><b>수인이 4자리 비밀번호:</b></label>
      <input type="password" id="pinInput" class="modal-input" placeholder="4자리 숫자" maxlength="4" inputmode="numeric">
    </div>

    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="next" style="flex:1;margin-top:0" onclick="applyLogin()">확인</button>
      <button class="next" style="background:var(--card);color:var(--ink);margin-top:0" onclick="closeModal('loginModal')">취소</button>
    </div>
  </div>
</div>

<div id="noteModal" class="modal hide">
  <div class="modal-box">
    <h2>🦁 수인이의 오답 노트</h2>
    <div id="noteContent" style="min-height:120px;font-size:.95rem;">기록을 불러오는 중...</div>
    <button class="next" style="width:100%;margin-top:16px" onclick="closeModal('noteModal')">닫기</button>
  </div>
</div>

<script>
function $(id) { return document.getElementById(id); }
function store(k, v) {
  try {
    if (v === undefined) return JSON.parse(localStorage.getItem(k));
    localStorage.setItem(k, JSON.stringify(v));
  } catch (e) {
    return null;
  }
}
const shuffle = a => {
  a = [...a];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.random() * (i + 1) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

const SUIN_PIN = "2017";
let currentUser = store("activeUser") || { role: "guest", name: "게스트" };
let currentHabits = [];
let playerKeys = 0;
let playerStreak = 0;

const now = new Date();
const days = ["일", "월", "화", "수", "목", "금", "토"];
$("currentDateStr").textContent = `${now.getMonth() + 1}월 ${now.getDate()}일 (${days[now.getDay()]}요일)`;

function updateUserBar() {
  const isSuin = currentUser.role === "suin";
  $("userDisplay").textContent = isSuin ? "🦁 수인" : `👤 ${currentUser.name}`;
  $("openNoteBtn").style.display = isSuin ? "inline-block" : "none";
  $("loginBtn").textContent = isSuin ? "로그아웃" : "사용자 변경";
}

$("loginBtn").onclick = () => {
  if (currentUser.role === "suin") {
    currentUser = { role: "guest", name: "게스트" };
    store("activeUser", currentUser);
    updateUserBar();
    loadDashboard();
  } else {
    $("loginModal").classList.remove("hide");
    togglePinInput();
  }
};

function togglePinInput() {
  const role = $("roleSelect").value;
  if (role === "suin") {
    $("guestField").classList.add("hide");
    $("pinField").classList.remove("hide");
    $("pinInput").focus();
  } else {
    $("guestField").classList.remove("hide");
    $("pinField").classList.add("hide");
    $("guestNameInput").focus();
  }
}

function applyLogin() {
  const role = $("roleSelect").value;
  if (role === "suin") {
    const pin = $("pinInput").value;
    if (pin === SUIN_PIN) {
      currentUser = { role: "suin", name: "수인" };
      store("activeUser", currentUser);
      closeModal('loginModal');
      $("pinInput").value = "";
      updateUserBar();
      loadDashboard();
    } else {
      alert("비밀번호가 일치하지 않아요!");
      $("pinInput").value = "";
      $("pinInput").focus();
    }
  } else {
    const gName = $("guestNameInput").value.trim() || "게스트";
    currentUser = { role: "guest", name: gName };
    store("activeUser", currentUser);
    closeModal('loginModal');
    updateUserBar();
    loadDashboard();
  }
}

function closeModal(id) { $(id).classList.add("hide"); }

// ===== 퀘스트 / 습관 API 연동 =====
async function loadDashboard() {
  const isSuin = currentUser.role === "suin";
  showBest();

  if (!isSuin) {
    const local = store(`localHabits_${currentUser.name}`) || [
      { id: 1, title: "오늘 책 20분 읽기", completed: false },
      { id: 2, title: "방 깨끗이 정돈하기", completed: false }
    ];
    currentHabits = local;
    playerKeys = store(`localKeys_${currentUser.name}`) || 2;
    playerStreak = 1;
    renderHabits();
    return;
  }

  try {
    const res = await fetch(`/api/habits?player=${encodeURIComponent(currentUser.name)}`);
    const data = await res.json();
    currentHabits = data.habits || [];
    playerKeys = data.status?.keys || 0;
    playerStreak = data.status?.streak || 0;
    renderHabits();
  } catch (e) {
    $("questList").innerHTML = `<div style="text-align:center;color:var(--no);padding:14px">퀘스트 불러오기 실패</div>`;
  }
}

function renderHabits() {
  $("keyCount").textContent = playerKeys;
  $("streakCount").textContent = playerStreak;

  const doneCount = currentHabits.filter(h => h.completed).length;
  $("questProgress").textContent = `${doneCount} / ${currentHabits.length} 완료`;

  const listEl = $("questList");
  if (currentHabits.length === 0) {
    listEl.innerHTML = `<div style="text-align:center;padding:18px;color:var(--sub)">등록된 오늘의 퀘스트가 없어요.<br>아래에서 해낼 일을 직접 추가해 보세요! ✍️</div>`;
    return;
  }

  listEl.innerHTML = "";
  currentHabits.forEach(h => {
    const item = document.createElement("div");
    item.className = `quest-item ${h.completed ? 'done' : ''}`;
    item.innerHTML = `
      <div class="quest-left" onclick="toggleHabit(${h.id})">
        <div class="quest-check">${h.completed ? '✓' : ''}</div>
        <span class="quest-text">${h.title}</span>
      </div>
      <span class="quest-reward">${h.completed ? '완료! 🔑' : '+1 🔑'}</span>
      <button class="del-btn" title="삭제" onclick="deleteHabit(${h.id})">✕</button>
    `;
    listEl.appendChild(item);
  });
}

async function handleCreateQuest(e) {
  e.preventDefault();
  const input = $("newQuestTitle");
  const title = input.value.trim();
  if (!title) return;

  if (currentUser.role !== "suin") {
    currentHabits.push({ id: Date.now(), title, completed: false });
    store(`localHabits_${currentUser.name}`, currentHabits);
    input.value = "";
    renderHabits();
    return;
  }

  try {
    const res = await fetch("/api/habits", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "create", player: currentUser.name, title })
    });
    if (res.ok) {
      input.value = "";
      loadDashboard();
    }
  } catch (err) {
    alert("퀘스트 등록 실패");
  }
}

async function toggleHabit(id) {
  if (currentUser.role !== "suin") {
    const h = currentHabits.find(x => x.id === id);
    if (h) {
      h.completed = !h.completed;
      playerKeys += h.completed ? 1 : -1;
      playerKeys = Math.max(0, playerKeys);
      store(`localHabits_${currentUser.name}`, currentHabits);
      store(`localKeys_${currentUser.name}`, playerKeys);
      if (h.completed && typeof confetti === 'function') confetti({ particleCount: 50, spread: 60 });
      renderHabits();
    }
    return;
  }

  try {
    const res = await fetch("/api/habits", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "toggle", player: currentUser.name, habit_id: id })
    });
    const result = await res.json();
    if (result.completed && typeof confetti === 'function') {
      confetti({ particleCount: 70, spread: 70, origin: { y: 0.6 } });
    }
    loadDashboard();
  } catch (err) {
    alert("상태 변경 실패");
  }
}

async function deleteHabit(id) {
  if (!confirm("이 퀘스트를 삭제할까요?")) return;

  if (currentUser.role !== "suin") {
    currentHabits = currentHabits.filter(x => x.id !== id);
    store(`localHabits_${currentUser.name}`, currentHabits);
    renderHabits();
    return;
  }

  try {
    await fetch(`/api/habits?id=${id}&player=${encodeURIComponent(currentUser.name)}`, { method: "DELETE" });
    loadDashboard();
  } catch (err) {
    alert("삭제 실패");
  }
}

// ===== 퀴즈 시작 (열쇠 1개 소모) =====
async function handleStartQuiz(selectedMode) {
  if (currentUser.role !== "suin") {
    startQuizGame(selectedMode);
    return;
  }

  if (playerKeys < 1) {
    alert("🔑 열쇠가 부족해요!\n오늘 정한 퀘스트를 먼저 완료하고 열쇠를 얻어 보세요.");
    return;
  }

  try {
    const res = await fetch("/api/habits", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "use_key", player: currentUser.name })
    });
    const data = await res.json();
    if (!res.ok) {
      alert(data.error || "열쇠 소모 실패");
      return;
    }
    playerKeys = data.remainingKeys;
    $("keyCount").textContent = playerKeys;
    startQuizGame(selectedMode);
  } catch (err) {
    alert("서버 통신 오류");
  }
}

$("openNoteBtn").onclick = async () => {
  $("noteModal").classList.remove("hide");
  $("noteContent").innerHTML = "기록을 불러오는 중...";
  try {
    const res = await fetch(`/api/attempts?player=${encodeURIComponent(currentUser.name)}`);
    const data = await res.json();
    if (!data.wrong || data.wrong.length === 0) {
      $("noteContent").innerHTML = "<p style='color:var(--ok);'>🎉 틀린 문제가 없어요! 완벽합니다.</p>";
      return;
    }
    let html = "<p class='sub' style='margin-bottom:8px'>자주 헷갈렸던 문제들이에요:</p>";
    data.wrong.forEach(w => {
      html += `<div class="stat-item"><b>문제:</b> ${w.question}<br><span style="color:var(--ok);">정답: ${w.answer}</span> (오답 ${w.misses}회)</div>`;
    });
    $("noteContent").innerHTML = html;
  } catch (err) {
    $("noteContent").innerHTML = "<p style='color:var(--no);'>기록을 불러오지 못했습니다.</p>";
  }
};

/* ===== 퀴즈 게임 엔진 ===== */
let mode, qs = [], idx = 0, score = 0, combo = 0, locked = false, log = [];
const NAMES = { hanja1: "B단계 복습", hanja2: "모양 도전", hanja3: "5급 도전", hist: "세계사" };

function showBest() {
  const userKey = `quizBest_${currentUser.name}`;
  const b = store(userKey) || {};
  const t = Object.keys(b).map(k => NAMES[k] + " " + b[k] + "점").join(" / ");
  $("best").textContent = t ? `[${currentUser.name}] 최고 기록: ` + t : "";
}

async function startQuizGame(m) {
  mode = m;
  try {
    const res = await fetch(`/api/questions?mode=${encodeURIComponent(m)}&limit=10`);
    if (!res.ok) {
      alert(`API 응답 오류 (상태 코드: ${res.status})`);
      return;
    }
    const data = await res.json();
    if (!data.questions || data.questions.length === 0) {
      alert("문제를 불러오지 못했습니다. DB에 문제가 등록되어 있는지 확인해주세요.");
      return;
    }
    qs = data.questions.map(q => ({
      glyph: q.glyph || "",
      text: q.prompt,
      ans: q.answer,
      opts: shuffle([q.answer, ...q.options]),
      exp: q.explanation || (q.glyph ? `${q.glyph} = ${q.answer}` : q.answer),
      isHist: q.q_type === 'history'
    }));
  } catch (e) {
    alert(`통신 오류: ${e.message}`);
    return;
  }

  idx = 0; score = 0; combo = 0; log = [];
  $("home").classList.add("hide");
  $("end").classList.add("hide");
  $("game").classList.remove("hide");
  renderQuiz();
}

function renderQuiz() {
  const q = qs[idx];
  locked = false;
  $("prog").style.width = (idx / qs.length * 100) + "%";
  $("score").textContent = score + "점";
  $("combo").textContent = combo >= 2 ? "🔥 " + combo + "연속" : "";
  $("qbox").innerHTML = (q.glyph ? '<div class="glyph">' + q.glyph + '</div>' : "") +
    '<div class="txt">' + (idx + 1) + "/" + qs.length + " · " + q.text + "</div>";

  const o = $("opts");
  o.className = "opts" + (q.isHist ? " hist-opts" : "");
  o.innerHTML = "";

  q.opts.forEach(t => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = t;
    b.onclick = () => pickQuizOption(b, t);
    o.appendChild(b);
  });

  $("fb").className = "fb";
  $("next").classList.add("hide");
}

function pickQuizOption(btn, t) {
  if (locked) return;
  locked = true;
  const q = qs[idx];
  const right = (t === q.ans);

  log.push({
    q: (q.glyph ? q.glyph + " " : "") + q.text,
    chosen: t,
    answer: q.ans,
    correct: right
  });

  [...$("opts").children].forEach(b => {
    b.disabled = true;
    if (b.textContent === q.ans) b.classList.add("ok");
  });

  if (right) {
    combo++;
    score += 10 + (combo >= 3 ? 5 : 0);
  } else {
    combo = 0;
    btn.classList.add("no");
  }

  $("score").textContent = score + "점";
  $("combo").textContent = combo >= 2 ? "🔥 " + combo + "연속" : "";
  $("fb").innerHTML = (right ? "🎉 정답!" : "😮 아쉬워요!") + " " + q.exp;
  $("fb").className = "fb show";
  $("next").textContent = (idx === qs.length - 1) ? "결과 보기" : "다음 문제";
  $("next").classList.remove("hide");
  $("next").focus();
}

function finishQuiz() {
  $("game").classList.add("hide");
  $("end").classList.remove("hide");
  const max = qs.length * 10;
  const r = score / max;
  const n = r >= .9 ? 3 : r >= .6 ? 2 : r >= .3 ? 1 : 0;

  $("stars").textContent = "⭐".repeat(n) + "☆".repeat(3 - n);
  $("endt").textContent = score + "점!";
  $("endp").textContent = n === 3 ? "대단해요! 완벽에 가까워요." : n === 2 ? "잘했어요! 한 번 더 하면 별 3개!" : "좋은 시작이에요. 다시 도전해 볼까요?";

  const userKey = `quizBest_${currentUser.name}`;
  const b = store(userKey) || {};
  if (!b[mode] || score > b[mode]) {
    b[mode] = score;
    store(userKey, b);
  }

  fetch("/api/attempts", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      player: currentUser.name,
      mode,
      score,
      total: qs.length,
      answers: log
    })
  }).catch(() => {});
}

$("next").onclick = () => {
  idx++;
  idx >= qs.length ? finishQuiz() : renderQuiz();
};
$("again").onclick = () => handleStartQuiz(mode);
const goHome = () => {
  $("game").classList.add("hide");
  $("end").classList.add("hide");
  $("home").classList.remove("hide");
  loadDashboard();
};
$("home2").onclick = goHome;
$("quit").onclick = goHome;

updateUserBar();
loadDashboard();
</script>
